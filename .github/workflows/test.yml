name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api_ref:
        description: pennypal-api branch, tag or SHA to test against
        default: main

jobs:
  static:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright E2E (against pennypal-api)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_API_DIR: ${{ github.workspace }}/pennypal-api
      API_URL: http://localhost:4000
      # pennypal-api is private: GITHUB_TOKEN can only read this repo, so checking it out needs a
      # token with Contents: read on kartikeya1981/pennypal-api, stored as the API_REPO_TOKEN secret.
      API_REPO_TOKEN: ${{ secrets.API_REPO_TOKEN }}
    steps:
      - name: Check API access
        id: gate
        run: |
          if [ -z "$API_REPO_TOKEN" ]; then
            echo "::warning title=E2E skipped::Add an API_REPO_TOKEN secret (read access to kartikeya1981/pennypal-api) to run the Playwright suite."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          path: pennypal-ui
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          repository: kartikeya1981/pennypal-api
          ref: ${{ inputs.api_ref || 'main' }}
          token: ${{ secrets.API_REPO_TOKEN }}
          path: pennypal-api
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            pennypal-ui/package-lock.json
            pennypal-api/package-lock.json

      - name: Set up API database
        if: steps.gate.outputs.enabled == 'true'
        working-directory: pennypal-api
        run: |
          npm ci
          cat > .env <<ENV
          DATABASE_URL="file:./e2e.db"
          JWT_SECRET="$(openssl rand -base64 32)"
          PORT=4000
          CORS_ORIGIN="http://localhost:3000"
          ENV
          npx prisma migrate deploy
          npm run db:seed

      - name: Install UI dependencies and browsers
        if: steps.gate.outputs.enabled == 'true'
        working-directory: pennypal-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        if: steps.gate.outputs.enabled == 'true'
        working-directory: pennypal-ui
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: playwright-report
          path: |
            pennypal-ui/playwright-report
            pennypal-ui/test-results
          retention-days: 14
